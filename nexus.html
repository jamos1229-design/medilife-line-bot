// ── 年齢自動計算（生年月日→今日時点の満年齢）────────────────
const calcAge = birthdate => {
  if (!birthdate) return null;
  const [y, m, d] = birthdate.split('-').map(Number);
  const today = new Date();
  let age = today.getFullYear() - y;
  if (today.getMonth() + 1 < m || today.getMonth() + 1 === m && today.getDate() < d) age--;
  return age;
};
// 生年月日から「ある日付の時点での年齢」を計算する（calcAgeは常に「今日時点」なので、
// 保険期間の終了日時点の年齢を出すのにはこちらを使う）
const nexusAgeAtDate = (birthdate, targetDate) => {
  if (!birthdate || !targetDate) return null;
  const [by, bm, bd] = birthdate.split('-').map(Number);
  const [ty, tm, td] = targetDate.split('-').map(Number);
  let age = ty - by;
  if (tm < bm || tm === bm && td < bd) age--;
  return age;
};
// 収入保障保険等、保険金額が「月額」で登録される契約の保険期間終了年齢を特定する。
// 「保険期間 終了日」（日付）×被保険者生年月日から算出できればそれを優先し、
// 無ければ「保険期間」欄のフリーテキストから「◯歳」のパターンを拾う。特定できなければnull。
const nexusTermEndAge = (termEnd, termNote, birthdate) => {
  if (termEnd && birthdate) {
    const a = nexusAgeAtDate(birthdate, termEnd);
    if (a !== null) return a;
  }
  const m = (termNote || '').match(/(\d+)\s*歳/);
  return m ? parseInt(m[1], 10) : null;
};

// ── 手動入力年齢の自動加算（入力年を記録して毎年+1）─────────
// 入力時に ageYear（入力した西暦）を一緒に保存
// 表示時: 入力年齢 + (今年 - 入力年) で現在の年齢を算出
const calcStoredAge = (age, ageYear) => {
  if (!age) return null;
  const diff = ageYear ? new Date().getFullYear() - Number(ageYear) : 0;
  return Number(age) + diff;
};

// 「お子様」サスペクトが、実在の子として扱ってよい情報を持っているかどうかの判定。
// 名前も生年月日／年齢も未入力の空き枠に加えて、「お子様1」「お子様2」等の
// 自動採番プレースホルダー名のまま生年月日／年齢が未入力のものも「未使用の枠」とみなす
// （候補チップで名前を確定した後もこの古い空き枠が残ってしまい、実在の子と重複して
// カウントされてしまう不具合があったため）。
const nexusHasRealChildIdentity = sp => {
  const name = (sp.name || '').trim();
  const hasAge = !!(sp.birthdate || sp.age || sp.ageYear);
  if (hasAge) return true;
  if (!name) return false;
  return !/^お子様\d+$/.test(name);
};
// 「お子様1」等の自動採番プレースホルダーは実名として画面・帳票に出さない（名前未入力の子として扱う）。
// 例：名前未入力・0歳の子がkidsSummaryで「お子様20歳」と表示され「20歳」に見えてしまう不具合の原因。
const nexusChildDisplayName = sp => {
  const name = ((sp && sp.name) || '').trim();
  return name && !/^お子様\d+$/.test(name) ? name : '';
};
// 印刷HTML内の個人名を伏せる（AI等への共有用）。構造化された名前フィールド（本人・配偶者・
// お子様・ご家族欄）のみを対象とし、メモ等の自由記述までは検出しない（誤検知・過検知を避けるため）。
function nexusEscapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
// nameMap: [{name, placeholder}] を、名前が長い順に適用する（短い名前が長い名前の部分文字列に
// なっているケースで誤って先に置換されるのを防ぐため）。
function nexusAnonymizeNames(html, nameMap) {
  const entries = (nameMap || []).filter(e => e && e.name && e.name.trim()).sort((a, b) => b.name.length - a.name.length);
  let result = html;
  entries.forEach(({
    name,
    placeholder
  }) => {
    const re = new RegExp(nexusEscapeRegExp(name), 'g');
    result = result.replace(re, placeholder);
  });
  return result;

// ── JSON Import（全データ対応）────────────────────────────────
function importJSON(file, handlers) {
  // handlers = { setCustomers, setTasks, setClients, setVision, setSuspects, setSales, setLogs,
  //              setMemos, setKpiSettings, setNexusServices, setNexusServiceLinks, setNexusMission }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);

      // ⓪ 全データバックアップ形式（機種変更などで端末を移行する場合に使用）
      //    { __medilifeBackup: true, customers, memos, kpiSettings, tasks, clients, vision,
      //      suspects, logs, sales, nexusServices, nexusServiceLinks, nexusMission }
      if (data.__medilifeBackup) {
        if (!confirm('この端末の現在のデータをすべて、バックアップの内容で置き換えます。よろしいですか？')) return;
        if (data.customers) handlers.setCustomers(data.customers);
        if (data.memos && handlers.setMemos) handlers.setMemos(data.memos);
        if (data.kpiSettings && handlers.setKpiSettings) handlers.setKpiSettings(data.kpiSettings);
        if (data.tasks && handlers.setTasks) handlers.setTasks(data.tasks);
        if (data.activityLogs && handlers.setActivityLogs) handlers.setActivityLogs(data.activityLogs);
        if (data.clients && handlers.setClients) handlers.setClients(data.clients);
        if (data.vision && handlers.setVision) handlers.setVision(data.vision);
        if (data.suspects && handlers.setSuspects) handlers.setSuspects(data.suspects);
        if (data.logs && handlers.setLogs) handlers.setLogs(data.logs);
        if (data.sales && handlers.setSales) handlers.setSales(data.sales);
        if (data.nexusServices && handlers.setNexusServices) handlers.setNexusServices(data.nexusServices);
        if (data.nexusServiceLinks && handlers.setNexusServiceLinks) handlers.setNexusServiceLinks(data.nexusServiceLinks);
        if (data.nexusMission && handlers.setNexusMission) handlers.setNexusMission(data.nexusMission);
        alert('✅ 全データを復元しました');
        return;
      }

      // ① app.html バックアップ形式
      //    { tasks, clients, suspects, vision, sales, logs, exportedAt, version }
      if (data.tasks || data.logs || data.clients && !data.customers) {
        const msgs = [];
        if (data.tasks && handlers.setTasks) {
          handlers.setTasks(data.tasks);
          msgs.push(`タスク${data.tasks.length}件`);
        }
        if (data.clients && handlers.setClients) {
          handlers.setClients(data.clients);
          msgs.push(`クライアント${data.clients.length}件`);
        }
        if (data.suspects && handlers.setSuspects) {
          handlers.setSuspects(data.suspects);
          msgs.push(`サスペクト${data.suspects.length}件`);
        }
        if (data.vision && handlers.setVision) {
          handlers.setVision(data.vision);
        }
        if (data.sales && handlers.setSales) {
          handlers.setSales(data.sales);
        }
        if (data.logs && handlers.setLogs) {
          handlers.setLogs(data.logs);
          msgs.push(`ログ${data.logs.length}件`);
        }
        alert(`✅ バックアップ復元完了\n${msgs.join(' / ')}`);
        return;
      }

      // ② nexus.html JSON エクスポート形式 { customers: [...] }
      if (data.customers && Array.isArray(data.customers)) {
        handlers.setCustomers(prev => {
          const existingIds = new Set(prev.map(c => c.id));
          const newOnes = data.customers.filter(c => !existingIds.has(c.id));
          alert(`✅ 顧客インポート完了：${newOnes.length}件追加`);
          return [...prev, ...newOnes];
        });
        return;
      }

      // ③ 直接配列（顧客データ）
      if (Array.isArray(data)) {
        handlers.setCustomers(prev => {
          const existingIds = new Set(prev.map(c => c.id));
          const newOnes = data.filter(c => !existingIds.has(c.id));
          alert(`✅ 顧客インポート完了：${newOnes.length}件追加`);
          return [...prev, ...newOnes];
        });
        return;
      }
      alert('対応していないファイル形式です');
    } catch {
      alert('JSONの読み込みに失敗しました');
    }
  };
  reader.readAsText(file, 'UTF-8');
}
function importCSV(file, setCustomers) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const text = e.target.result.replace(/^﻿/, ''); // BOM除去
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) {
        alert('データがありません');
        return;
      }
      const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
      const parseVal = v => v.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
      const imported = lines.slice(1).map(line => {
        // カンマ区切り（引用符内のカンマを考慮）
        const cols = [];
        let cur = '',
          inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            inQ = !inQ;
          } else if (ch === ',' && !inQ) {
            cols.push(cur);
            cur = '';
          } else {
            cur += ch;
          }
        }
        cols.push(cur);
        const get = key => parseVal(cols[headers.indexOf(key)] || '');
        const name = get('氏名') || get('name') || get('名前');
        if (!name) return null;

        // 契約データの復元（証券番号一覧・払込方法一覧・通貨一覧から）
        const policyNums = get('証券番号一覧').split('/').map(s => s.trim()).filter(Boolean);
        const payCycles = get('払込方法一覧').split('/').map(s => s.trim()).filter(Boolean);
        const currencies = get('通貨一覧').split('/').map(s => s.trim()).filter(Boolean);
        const contractCount = parseInt(get('契約数')) || policyNums.length;
        const contracts = Array.from({
          length: contractCount
        }, (_, i) => ({
          id: String(Date.now() + Math.random() + i),
          category: '生保',
          type: '',
          company: '',
          policyNum: policyNums[i] || '',
          paymentCycle: payCycles[i] || '月払',
          currency: currencies[i] || '円',
          insuredName: '',
          insuredBirthdate: '',
          premium: '',
          date: '',
          termEnd: '',
          coverage: '',
          memo: ''
        }));
        return {
          id: String(Date.now() + Math.random()),
          customerType: '個人',
          name,
          age: get('年齢') || get('age') || '',
          gender: get('性別') || '',
          birthdate: get('生年月日') || '',
          phone: get('電話番号') || get('phone') || '',
          email: get('メールアドレス') || get('email') || '',
          postalCode: get('郵便番号') || '',
          address: get('住所') || get('address') || '',
          occupation: get('職業') || get('occupation') || '',
          workplace: get('勤務先') || get('workplace') || get('会社') || '',
          status: get('ステータス') || get('status') || '未接触',
          contactMethod: get('接触方法') || '電話',
          lastContact: get('最終接触日') || '',
          nextAppt: get('次回アポイント') || '',
          memo: get('面談メモ') || get('memo') || get('メモ') || '',
          lineRegistered: get('LINE登録') === '登録済',
          contracts,
          suspects: [],
          referredBy: '',
          // 人脈ネクサスのCSV形式（名前,職業,会社,電話,住所,紹介者,メモ）用：
          // 紹介者は名前で指定されるため、既存顧客とのマージ後に名前→IDで解決する
          referrerName: get('紹介者') || ''
        };
      }).filter(Boolean);
      if (imported.length === 0) {
        alert('インポートできる行がありません');
        return;
      }
      setCustomers(prev => {
        const displayName = c => c.customerType === '法人' ? c.corporateName || c.name : c.name;
        const existingNames = new Set(prev.map(displayName).filter(Boolean));
        const fresh = imported.filter(c => !existingNames.has(c.name));
        const skipped = imported.length - fresh.length;
        const nameToId = {};
        prev.forEach(c => {
          const n = displayName(c);
          if (n && !(n in nameToId)) nameToId[n] = c.id;
        });
        fresh.forEach(c => {
          if (!(c.name in nameToId)) nameToId[c.name] = c.id;
        });
        const resolved = fresh.map(({
          referrerName,
          ...c
        }) => ({
          ...c,
          referredBy: referrerName ? nameToId[referrerName] || '' : ''
        }));
        const merged = [...prev, ...resolved];
        alert(`インポート完了：${resolved.length}件追加` + (skipped > 0 ? `（同姓同名の既存顧客 ${skipped}件はスキップ）` : ''));
        return merged;
      });
    } catch (err) {
      alert('CSVの読み込みに失敗しました: ' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

// クライアントコードに埋め込むしかなく、それは第三者に抜き取られ悪用されるリスクがある。
// 画像・個人情報を外部に送らずに済むブラウザ内OCRを優先し、認識精度の甘さは
// 「取込内容確認」画面での手修正を前提にした設計で補う。

function nexusEnsureOcrLib(callback) {
  if (window.Tesseract) {
    callback();
    return;
  }
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  script.onload = () => callback();
  script.onerror = () => alert('画像認識ライブラリの読み込みに失敗しました。インターネット接続をご確認のうえ、もう一度お試しください。');
  document.head.appendChild(script);
}
// モニターをスマホで撮影した写真は、カメラのセンサーと画面の格子が干渉して虹色の縞模様
// （モアレ）が出やすく、そのままだと文字認識の精度が大きく落ちる。モアレは主に色の
// ズレとして現れるため、輝度だけを使ってグレースケール化するとかなり軽減できる。
// あわせてコントラストを強調し、文字が小さい写真は拡大して読み取りやすくする。
function nexusPreprocessImageForOcr(file, callback) {
  try {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const scale = img.width < 1800 ? Math.min(2.2, 1800 / img.width) : 1;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          const contrasted = Math.max(0, Math.min(255, (gray - 128) * 1.35 + 128));
          d[i] = d[i + 1] = d[i + 2] = contrasted;
        }
        ctx.putImageData(imgData, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => callback(blob || file), 'image/png');
      } catch (e) {
        URL.revokeObjectURL(url);
        callback(file);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      callback(file);
    };
    img.src = url;
  } catch (e) {
    callback(file);
  }
}

    furigana: furiganaTokens.join(' '),

}
// 「担当者氏名」等、同じ氏名がほぼ全行に繰り返し出てくる列がある表では、その担当者名が

// 生年月日・電話番号のどちらかが読み取れた行だけを「顧客の行」とみなす
// （表の見出しや罫線などのノイズ行は、どちらも無いことがほとんどのため除外できる）。
function nexusExtractOcrRows(text) {
  const rows = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 1).map(nexusParseOcrLine).filter(r => (r.birthdate || r.phone) && (r.name || r.furigana || r.policyNum));

// ── 画像取込：表構造を理解したOCR（座標ベースの行・列復元）─────────────
// CSB等の顧客一覧のような列の多い密な表は、画像全体を1つの文章として読む方式だと
// 列の読み取り順序が入れ替わってしまい、無関係な列の文字が混ざる（これが「間串」
// 「上上上」のような意味不明な文字列の正体）。これを避けるため、Tesseractの
// 単語ごとの座標（bbox）を使い、①単語をY座標で「行」にまとめる→②先頭の見出し行
// （証券番号・氏名・カナ…）からX座標ごとの「列」を検出する→③データ行の各単語を
// 一番近い列に割り当てる、という表としての復元を行う。

    words.push({
      text: t,
      confidence: typeof w.confidence === 'number' ? w.confidence : 0,
      x0: w.bbox.x0,
      x1: w.bbox.x1,
      y0: w.bbox.y0,
      y1: w.bbox.y1,

// 単語をY座標（中心）でグルーピングして「行」にする。行の高さの中央値の7割以内の

      currentY = current.reduce((s, x) => s + x.yc, 0) / current.length;

      current = [w];

      context = 'contractor';
      return;

    if (/顧客/.test(w.text)) {
      context = 'customer';
      return;

        x: w.xc,
        type: 'nameKanji_' + context

        x: w.xc,
        type: 'nameKana_' + context

// 登録してしまわないため）。

    headerRows,
    dataRows

    ok: false,
    rows: []

    const postalParsed = nexusParseOcrLine(postalRaw);

    const birthParsed = nexusParseOcrLine(birthRaw);
    return {
      name: nameCell.text,
      furigana: kanaCell.text,
      birthdate: birthParsed.birthdate,
      phone: phoneParsed.phone,
      postalCode: postalParsed.postalCode,
      address: cells.address ? cells.address.text : '',
      email: '',

      company: companyMatch.company,
      policyNum: cells.policyNum ? cells.policyNum.text : '',

        name: nameCell.confidence,

        postalCode: cells.postal ? cells.postal.confidence : 0,

// ── CSB専用取込：人が表範囲・列位置を指定し、機械は行の切り出しとセルOCRに
// 専念する方式 ────────────────────────────────────────────────
// 汎用OCRで表全体を文章として読む方式は、モアレのひどい写真では見出しの
// 自動検出自体が失敗する。そこで、①表の四隅は人が指定→透視変換で正面向きの
// 長方形に補正、②行の境界は横罫線の濃淡（画像処理）から検出（OCR結果からの
// 改行推測はしない）、③列位置は人が一度だけ校正してlocalStorageに保存、
// ④証券番号・氏名それぞれのセル画像だけを個別にOCRする、という設計にする。

// 4点対応（射影先→元画像）から射影変換行列を解く（OpenCV等の外部ライブラリを
// 使わず、8元連立一次方程式をガウスの消去法で解く標準的な方法）。
function nexusSolveLinearSystem(A, b) {
  const n = A.length;
  const M = A.map((row, i) => [...row, b[i]]);
  for (let col = 0; col < n; col++) {
    let pivot = col;
    for (let r = col + 1; r < n; r++) {
      if (Math.abs(M[r][col]) > Math.abs(M[pivot][col])) pivot = r;
    }
    const tmp = M[col];
    M[col] = M[pivot];
    M[pivot] = tmp;
    const pv = M[col][col];
    if (Math.abs(pv) < 1e-12) continue;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = M[r][col] / pv;
      for (let c = col; c <= n; c++) M[r][c] -= factor * M[col][c];

  return M.map((row, i) => Math.abs(row[i]) < 1e-12 ? 0 : row[n] / row[i]);

      dx = dst[i].x,
      dy = dst[i].y;
    A.push([sx, sy, 1, 0, 0, 0, -sx * dx, -sy * dx]);
    b.push(dx);
    A.push([0, 0, 0, sx, sy, 1, -sx * dy, -sy * dy]);
    b.push(dy);
  }
  const h = nexusSolveLinearSystem(A, b);

// セル画像の前処理：グレースケール化＋コントラスト伸長、および大津の二値化

// 実装していないが、セルは既に小さく切り出し済みで照明ムラの影響が小さいため、

function nexusOtsuThreshold(imageData) {
  const {
    data

    maxVar = 0,
    threshold = 128;

    if (wB === 0) continue;
    const wF = n - wB;
    if (wF === 0) break;
    sumB += t * hist[t];
    const mB = sumB / wB;
    const mF = (sum - sumB) / wF;
    const varBetween = wB * wF * (mB - mF) * (mB - mF);
    // 同値（分散が変わらない＝ヒストグラムに隙間がある区間）の場合も更新することで、
    // しきい値が2つの山の間のギャップの端に寄り、暗い側の画素が「明るい」側に
    // 誤って分類されるのを防ぐ（>だと最初にタイになった時点で止まってしまう）。
    if (varBetween >= maxVar) {

    out[i * 4 + 1] = v;

// 証券番号セルの検証：英数字・ハイフンのみ、4〜19文字、数字を1つ以上含むこと。
// O/0・I/1・S/5・B/8等の誤読はここでは書き換えない（ユーザーの指示通り、
// 勝手な推測での置き換えはしない。confidenceで低信頼度として示すのみ）。
function nexusValidatePolicyNumCell(text) {
  const t = (text || '').replace(/[^0-9A-Za-z-]/g, '');
  if (t.length < 4 || t.length >= 20 || !/\d/.test(t)) return {
    text: t,
    valid: false
  };

    text: t,
    valid: true
  };
}
// 氏名セルの検証：10文字超・記号過多・同じ文字の異常な連続は失敗扱いにする。
function nexusValidateNameCell(text) {
  const t = (text || '').replace(/[|｜_＿]/g, '').trim();
  if (!t || t.length > 10) return {
    text: t,
    valid: false
  };
  const symbolRatio = (t.match(/[^一-龠々ぁ-んァ-ヶー\sA-Za-z]/g) || []).length / t.length;
  if (symbolRatio > 0.3) return {
    text: t,
    valid: false
  };
  if (/(.)\1{2,}/.test(t.replace(/\s/g, ''))) return {
    text: t,
    valid: false

  const kanaOrKanjiRatio = (t.match(/[一-龠々ぁ-んァ-ヶー]/g) || []).length / t.replace(/\s/g, '').length;
  if (kanaOrKanjiRatio < 0.5) return {
    text: t,
    valid: false
  };

    text: t,
    valid: true
  };

// 失敗扱いにする。CSB画面側で「タグチ…」のように省略表示されている場合、
// 見えている分だけを採用し、続きを推測で補完することはしない。
function nexusValidateKanaCell(text) {
  const t = (text || '').replace(/[|｜_＿]/g, '').trim();
  if (!t || t.length > 12) return {
    text: t,
    valid: false
  };
  // 漢字が1文字でも混ざっている場合は、隣の漢字氏名列からのはみ出し等
  // 列ズレを疑い、無効として要確認に回す（黙って漢字部分だけ捨てない）。
  if (/[一-龠々]/.test(t)) return {
    text: t,
    valid: false
  };
  const kanaOnly = t.replace(/[^ァ-ヶー\s]/g, '');
  const ratio = kanaOnly.replace(/\s/g, '').length / t.replace(/\s/g, '').length;
  if (ratio < 0.6) return {
    text: t,
    valid: false
  };
  return {
    text: kanaOnly.trim(),
    valid: true
  };
}
// 郵便番号の検証：数字とハイフンのみを対象に、NNN-NNNN形式かを確認する。
// ハイフンが消えて7桁の数字だけになっているケースは、それ自体を誤りとはせず
// 「NNN-NNNN形式の候補」として提示する（自動確定はしない＝呼び出し側で
// 必ずneedsReview扱いにすること）。
function nexusValidatePostalCode(text) {
  const t = (text || '').replace(/[^0-9-]/g, '');
  if (/^\d{3}-\d{4}$/.test(t)) return {
    text: t,
    valid: true,
    isCandidate: false
  };
  const digitsOnly = t.replace(/-/g, '');
  if (digitsOnly.length === 7) return {
    text: `${digitsOnly.slice(0, 3)}-${digitsOnly.slice(3)}`,
    valid: true,
    isCandidate: true
  };
  return {
    text: t,
    valid: false,
    isCandidate: false
  };
}
// 生年月日の検証：数字専用列という前提を利用し、字形の似た英字I/lを1に
// 補正したうえでYYYY-MM-DD形式かを確認し、さらに実在する日付かどうかも
// （2月30日等を弾くため）Dateオブジェクトの往復で確認する。補正前後の値は
// どちらもデバッグに残せるよう両方返す。
function nexusValidateBirthDate(text) {
  const raw = (text || '').trim();
  // 数字しか無い列という前提でのみ、字形が紛らわしい英字を1に読み替える
  const corrected = raw.replace(/[Il|]/g, '1').replace(/[^0-9-]/g, '');
  const m = corrected.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return {

    rawText: raw,
    valid: false

  const y = Number(m[1]),
    mo = Number(m[2]),
    d = Number(m[3]);
  const dt = new Date(y, mo - 1, d);
  const isRealDate = dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d;

// 呼び出し側でこの関数自体を呼ばない（空欄のまま）。
function nexusValidateGenderCell(text) {
  const t = (text || '').trim();
  if (/女/.test(t)) return {
    text: '女性',
    valid: true
  };
  if (/男/.test(t)) return {
    text: '男性',
    valid: true
  };
  return {
    text: t,
    valid: false
  };
}

// 取込候補行が既存顧客と重複していそうかを判定する。完全一致だけでなく
// 「氏名＋生年月日」「氏名＋フリガナ」の組み合わせ一致、電話番号の完全一致も
// 重複候補として拾う（電話番号は表記ゆれを避けるため数字だけで比較する）。
function nexusFindDuplicateCandidates(row, customers) {
  const rName = (row.name || '').trim();
  const rKana = (row.furigana || '').trim();
  const rBirth = (row.birthdate || '').trim();
  const rPhone = (row.phone || '').replace(/[^\d]/g, '');
  if (!rName && !rPhone) return [];
  return (customers || []).filter(c => {
    const cName = (c.customerType === '法人' ? c.corporateName : c.name) || '';
    const cKana = c.furigana || '';
    const cBirth = c.birthdate || '';
    const cPhone = (c.phone || '').replace(/[^\d]/g, '');
    const nameMatch = rName && cName && rName === cName.trim();
    const kanaMatch = rKana && cKana && rKana === cKana.trim();
    const birthMatch = rBirth && cBirth && rBirth === cBirth;
    const phoneMatch = rPhone.length >= 8 && rPhone === cPhone;
    return phoneMatch || nameMatch && birthMatch || nameMatch && kanaMatch;
  });
}

// ── 文字貼り付けによる顧客取込：TextImportParser ─────────────
// CSBの顧客一覧をスマホで撮影→iPhoneのテキスト認識やGoogle Keep等で文字を
// 抽出→その全文をそのまま貼り付けて顧客登録候補を作る機能。重いOCRは行わず、
// 既に文字化された（ただし改行位置や区切りが崩れた）テキストをルールベースで
// 解析するだけなので高速。外部AI APIへは一切送信しない。
// 将来的に名刺等へも広げられるよう、「正規化」「証券番号アンカー検出」等の
// 汎用部分と、CSB特有の列順・ラベルに依存する部分（nexusParseCsbBlock等）を
// 分けている。CSB以外の解析器を追加する場合はnexusParseCsbPastedTextと同じ
// 形（{original, normalized, records}を返す）の関数を用意すればよい。

// STEP1：テキスト正規化（元の文字列はそのまま保持し、正規化後の文字列を
// 別途返す。デバッグ画面で両方を確認できるようにするため）。
function nexusNormalizeImportText(raw) {
  const original = raw || '';
  let t = original.normalize('NFKC'); // 全角数字・全角英字→半角、各種互換文字を統一
  t = t.replace(/\r\n?/g, '\n'); // CRLF/CRをLFに統一
  // 各種ハイフン・ダッシュ類（hyphen/en dash/em dash/minus sign/fullwidth hyphen）を
  // 半角ハイフンに統一する。カナの長音記号「ー」は名前の一部になり得るため対象外。
  t = t.replace(/[‐-―−－]/g, '-');
  // ゼロ幅文字・制御文字（改行以外）を除去
  t = t.replace(/[​-‏﻿\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, '');
  // OCRの罫線がパイプ文字として誤読されることがあるため空白に置換
  t = t.replace(/[|｜_＿]/g, ' ');
  t = t.replace(/[ \t]+/g, ' '); // タブ・連続スペースを整理
  t = t.replace(/ *\n */g, '\n'); // 行頭行末の余分な空白を除去
  t = t.replace(/\n{3,}/g, '\n\n'); // 3行以上の空行は2行に圧縮
  t = t.trim();
  return {
    original,
    normalized: t
  };
}

// STEP2：証券番号らしいトークンをアンカーとして検出し、そこから次のアンカーの
// 手前までを「1契約分の塊」とみなす。単純なsplit('\n')に頼らないための要。
function nexusIsPolicyNumCandidate(token) {
  const t = (token || '').trim();
  if (t.length < 6 || t.length > 16) return false;
  if (!/^[0-9A-Za-z]+(-[0-9A-Za-z]+)*$/.test(t)) return false;
  if (!/\d/.test(t)) return false;
  const digitsOnly = t.replace(/[^0-9]/g, '');
  const hasLetter = /[A-Za-z]/.test(t);
  if (!hasLetter) {
    // 数字だけの場合、電話番号・郵便番号の形に一致するものは証券番号として扱わない
    if (digitsOnly.length >= 10 && digitsOnly.length <= 11 && digitsOnly[0] === '0') return false;
    if (/^\d{3}-?\d{4}$/.test(t)) return false;
    if (digitsOnly.length === 8) {
      const y = Number(digitsOnly.slice(0, 4)),
        mo = Number(digitsOnly.slice(4, 6)),
        d = Number(digitsOnly.slice(6, 8));
      if (y >= 1900 && y <= new Date().getFullYear() && mo >= 1 && mo <= 12) {
        const dt = new Date(y, mo - 1, d);
        if (dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d) return false; // 生年月日らしい8桁数字は除外
      }
    }

  if (/^(19|20)\d{2}-\d{1,2}-\d{1,2}$/.test(t)) return false; // 生年月日らしい形は除外

  const anchors = [];
  let m;
  NEXUS_TEXT_POLICY_TOKEN_RE.lastIndex = 0;
  while (m = NEXUS_TEXT_POLICY_TOKEN_RE.exec(text)) {
    if (nexusIsPolicyNumCandidate(m[0])) anchors.push({
      raw: m[0],
      index: m.index
    });
  }
  return anchors;
}

  const anchors = nexusFindPolicyNumAnchors(text);
  if (anchors.length === 0) return text.trim() ? [{
    policyNum: '',
    text
  }] : [];
  return anchors.map((a, i) => ({
    policyNum: a.raw,
    text: text.slice(a.index, i + 1 < anchors.length ? anchors[i + 1].index : text.length)
  }));
}

// STEP3：数値項目の抽出。OCRは改行位置が崩れやすいため、改行を空白1個に

function nexusFlattenBlockText(blockText) {

}

  const m = text.match(re);
  if (!m) return null;
  const y = Number(m[1]),
    mo = Number(m[2]),
    d = Number(m[3]);
  const normalized = `${m[1]}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const dt = new Date(y, mo - 1, d);
  const isRealDate = dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d;
  const inRange = y >= 1900 && y <= new Date().getFullYear();

    raw: m[0],

  // 前半2組）は郵便番号として誤認しないよう除外する。

    normalized: `${mH[1]}-${mH[2]}`,
    isCandidate: false,
    index: mH.index

    normalized: `${mB[1].slice(0, 3)}-${mB[1].slice(3)}`,

  // 一部の「0」に誤爆した等）、そこで諦めず他の候補も順に試す。また直前が
  // 数字・ハイフンのいずれでもない位置からのみ開始を許可し、郵便番号

  } : null;

    const isPureKana = /^[ァ-ヶー\s]+$/.test(line.replace(/[|｜_＿]/g, ''));
    if (isPureKana) {
      const kanaV = nexusValidateKanaCell(line);
      if (kanaV.valid) {
        candidates.push({
          kind: 'kana',
          text: kanaV.text,
          lineIndex: i

        continue;
      }
    }
    const kanjiV = nexusValidateNameCell(line);
    if (kanjiV.valid) {
      candidates.push({
        kind: 'kanji',
        text: kanjiV.text,
        lineIndex: i

      continue;
    }
    // 氏名が2行に分断されている場合の救済策として、次の行と結合して再判定する
    if (i + 1 < lines.length && !excludeSet.has(i + 1)) {
      const joined = `${line}${lines[i + 1]}`;
      const kanjiJ = nexusValidateNameCell(joined);
      if (kanjiJ.valid) {
        candidates.push({
          kind: 'kanji',
          text: kanjiJ.text,
          lineIndex: i

// 検出した氏名候補を「顧客氏名」「契約者氏名」に割り当てる。CSBの列順
// （顧客氏名→顧客カナ→契約者氏名→契約者カナ）に対応する並び順を前提に、
// 最初に見つかった漢字氏名を顧客、次に見つかった別人の漢字氏名を契約者とする。
function nexusAssignNameRoles(candidates) {
  const kanjiCands = candidates.filter(c => c.kind === 'kanji');

  const customerNameLineIdx = kanjiCands[0] ? kanjiCands[0].lineIndex : -1;
  let policyholderName = '',

  for (const c of kanjiCands.slice(1)) {

  }

    }

  if (polKana) usedKana.add(polKana.lineIndex);

    customerNameKana: custKana ? custKana.text : '',

// 完全一致だけでなく、空白の有無だけが違う場合（OCR特有のずれ）も同一人物と

// STEP5：1契約ブロック分の解析。顧客氏名と契約者氏名が異なる場合、郵便番号・
// 生年月日は「契約者本人の情報である可能性がある」として、顧客本人の情報と
// 断定しない（呼び出し側の登録処理で自動反映しないようにする）。
function nexusParseCsbBlock(block) {
  const rawText = block.text;

  const excludeSet = new Set();
  lines.forEach((l, i) => {
    const compact = l.replace(/\s/g, '');
    const isHeader = NEXUS_TEXT_HEADER_STOPWORDS_RE.test(compact.replace(/[:：]/g, ''));
    const isPolicyLine = compact === block.policyNum;
    const isGenderLine = l === genderRaw;

    if (isHeader || isPolicyLine || isGenderLine || isStaffLine) excludeSet.add(i);

  lines.forEach((l, i) => {

  const roles = nexusAssignNameRoles(candidates);
  const policyValid = nexusValidatePolicyNumCell(block.policyNum);
  const customerEqualsPolicyholder = !roles.hasPolicyholderCol ? true : nexusNamesMatchLoosely(roles.customerName, roles.policyholderName);

  if (!policyValid.valid || !policyValid.text) reasons.push('証券番号が不自然です');
  if (!roles.customerName) reasons.push('顧客氏名が見つかりませんでした');
  if (roles.hasPolicyholderCol && !customerEqualsPolicyholder) reasons.push('顧客氏名と契約者氏名が一致しません（契約者情報です）');
  if (birth && !birth.valid) reasons.push('生年月日の形式または日付が不正です');
  if (postal && postal.isCandidate) reasons.push('郵便番号はハイフン無し7桁のため候補扱いです');
  if (genderRaw && genderValid && !genderValid.valid) reasons.push('性別欄を認識できませんでした');

    id: uid(),
    policyNum: policyValid.text || block.policyNum,
    name: roles.customerName,
    nameKana: roles.customerNameKana,
    policyholderName: roles.policyholderName,
    policyholderNameKana: roles.policyholderNameKana,
    customerEqualsPolicyholder,
    hasPolicyholderCol: roles.hasPolicyholderCol,
    birthDate: birth ? birth.normalized : '',
    birthDateValid: birth ? birth.valid : true,
    postalCode: postal ? postal.normalized : '',
    postalIsCandidate: postal ? postal.isCandidate : false,
    phone: phone ? phone.raw.replace(/\s+/g, '') : '',
    phoneDigits: phone ? phone.digits : '',
    email: email ? email.raw : '',
    gender: genderValid && genderValid.valid ? genderValid.text : '',

    reviewReasons: reasons,
    rawBlockText: rawText,

// STEP6：貼り付けテキスト全体の一括解析。同じ人物が複数の証券番号を持つ
// ケースを検出するが、自動統合はせず確認画面でユーザーに選ばせる。
function nexusParseCsbPastedText(rawText, customers) {
  const {
    original,
    normalized

  const blocks = nexusSplitIntoCsbBlocks(normalized);
  const records = blocks.map(b => nexusParseCsbBlock(b));
  records.forEach((r, i) => {
    // レコードのidで持つ（配列添字にすると、後で1件削除しただけで残り全員の
    // 添字がずれ、無関係な人へ誤統合しかねないため）。
    const siblings = [];
    records.forEach((r2, j) => {
      if (i === j || !r.name || !r2.name) return;
      if (nexusNamesMatchLoosely(r.name, r2.name)) siblings.push(r2.id);
    });
    r.siblingIds = siblings;
    if (siblings.length > 0) {
      r.reviewReasons.push('同一人物の可能性がある契約が他にもあります（下の一覧で確認してください）');
      r.status = 'review';
    }
    r.duplicates = nexusFindDuplicateCandidates({
      name: r.name,
      furigana: r.nameKana,
      birthdate: r.customerEqualsPolicyholder ? r.birthDate : '',

  });

    normalized,
    records

// ── RFC4180準拠 CSVパーサー（改行含むフィールド対応）──────────
function parseCSVFull(text) {
  const rows = [];
  let row = [],
    field = '',
    inQ = false,
    i = 0;
  const t = text.replace(/^﻿/, ''); // BOM除去
  while (i < t.length) {
    const ch = t[i];
    if (inQ) {
      if (ch === '"' && t[i + 1] === '"') {
        field += '"';
        i += 2;
      } else if (ch === '"') {
        inQ = false;
        i++;
      } else {
        field += ch;
        i++;
      }
    } else {
      if (ch === '"') {
        inQ = true;
        i++;
      } else if (ch === ',') {
        row.push(field);
        field = '';
        i++;
      } else if (ch === '\r' && t[i + 1] === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
        i += 2;
      } else if (ch === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
        i++;
      } else {
        field += ch;
        i++;
      }
    }
  }
  if (field || row.length > 0) {
    row.push(field);
    if (row.some(f => f)) rows.push(row);
  }
  return rows;
}

// 見出し行から、各NEXUS項目に対応していそうな列を自動判定する（完全一致優先、部分一致で補完）。
function nexusGuessColumnMapping(headers) {
  const norm = h => (h || '').replace(/[\s　]/g, '');

      contractorKana: cell(row1, 1),

      contractDate: nexusStripNoticeLabel(row0[8], /契約日[:：]\s*(.+)/),

// ファイル拡張子に応じて .xlsx/.xls（SheetJS）／.csv（既存のRFC4180パーサー）を読み分け、
// callbackへ結果を渡す。SheetJSは新しいOOXML形式(.xlsx)と旧バイナリ形式(.xls)の
// どちらも同じAPIで読めるため、旧形式でも「シートが見つかりませんでした」等の
// 分かりにくいエラーにならず、そのまま取り込める（ExcelJSは.xlsxのみ対応で、.xlsを
// 渡すとエラーを出さずにワークシート0件のまま処理が進んでしまう問題があった）。
// 通常の「1行=1見出し＋1行=1契約」の表は{kind:'flat', headers, rows}を、
// 「契約内容のご案内」のような1契約=複数行の通知書形式は見出し行を自動検出して
// {kind:'noticeReport', customerName, contracts}を返す。
// 契約書き出し（印刷・Excel出力）用のExcelJSとは別に、契約一覧の読み込み専用で
// SheetJSを遅延読み込みする。SheetJSはセル装飾の書き出しには向かないが、旧形式
// (.xls)を含む読み込み耐性がExcelJSより高く、読み込み専用の用途に向いている。
function nexusEnsureXlsxLib(callback) {
  if (window.XLSX) {
    callback();
    return;
  }
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  script.onload = callback;
  script.onerror = () => alert('Excel読み込みライブラリの取得に失敗しました。通信環境をご確認のうえ、もう一度お試しください。');
  document.head.appendChild(script);
}
function nexusParseWorkbookFile(file, callback) {
  const name = (file.name || '').toLowerCase();
  const toHeaderRows = rows => {
    const filled = rows.filter(r => r.some(c => (c || '').toString().trim()));
    if (filled.length < 1) {
      alert('データがありません');
      return;
    }
    const headers = filled[0].map(h => (h || '').toString().trim());
    callback({
      kind: 'flat',
      headers,
      rows: filled.slice(1)
    });
  };
  if (name.endsWith('.csv')) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        toHeaderRows(parseCSVFull(e.target.result));
      } catch (err) {
        alert('CSVの読み込みに失敗しました：' + err.message);
      }
    };
    reader.readAsText(file, 'UTF-8');
    return;
  }
  nexusEnsureXlsxLib(() => {
    file.arrayBuffer().then(buf => {
      const wb = window.XLSX.read(new Uint8Array(buf), {
        type: 'array'
      });
      const sheetName = wb.SheetNames[0];
      if (!sheetName) {
        alert('シートが見つかりませんでした');
        return;
      }
      const ws = wb.Sheets[sheetName];
      const rows = window.XLSX.utils.sheet_to_json(ws, {
        header: 1,
        raw: false,
        defval: ''
      });
      if (nexusLooksLikeInsuranceNoticeReport(rows)) {
        const {
          customerName,
          contracts
        } = nexusParseInsuranceNoticeReport(rows);
        callback({
          kind: 'noticeReport',
          customerName,
          contracts
        });
        return;
      }
      toHeaderRows(rows);
    }).catch(err => {
      alert('ファイルの読み込みに失敗しました。ファイル形式をご確認のうえ、もう一度お試しください（' + (err && err.message || '') + '）');
    });
  });
}

  if (convertible) return amount.toLocaleString() + '円（$' + raw.toLocaleString() + '）';

}

// ── ポートフォリオ（通貨別・資産クラス別）集計 ──
// 保険（貯蓄性＝目的「年金・貯蓄型」）は既存の契約データから自動算出。
// 投資信託・株式や不動産等は保険契約に存在しないため、手入力分（portfolioInputs）を加算する。
// 本人のみ／夫婦合算のどちらでも同じロジックで計算できるよう、対象契約リストを引数で受け取る。
function nexusComputePortfolio(contractsForCharts, portfolioInputs) {
  const savingsContracts = contractsForCharts.filter(ct => nexusContractPurposes(ct).includes('年金・貯蓄型'));
  let insuranceSavingsJpy = 0,

    // 年金保険の保険金額は年金年額（据置後に毎年受け取る金額）であって、現在ある資産の額とは
    // 全く別の意味の数字のため。未入力の場合は資産額が不明として集計から除外し、下に警告を出す。
    if (ct.currentSurrenderValue === undefined || ct.currentSurrenderValue === '') {

      currencyUnconvertible++;
      unconvertibleSavingsContracts.push(ct);
      return;
    }
    const {
      amount,
      convertible
    } = nexusContractJpyAmount(ct, 'currentSurrenderValue');
    if (!convertible) {
      insuranceSavingsUnconvertible++;
      currencyUnconvertible++;
      unconvertibleSavingsContracts.push(ct);
      return;
    }
    // 一般勘定（保険会社が運用、日本国債中心で安定）と特別勘定（契約者が運用リスクを負う）に分けて
    // 計上する。保険はどちらであっても株式・投資信託そのものではないため、資産クラス別の集計では
    // 「投資信託・株式等」には含めない（アクサ アップサイドプラス等、一般勘定・特別勘定を割合で
    // 持つ商品にも対応）。特別勘定は運用実績で変動するため、現在の実際の内訳（円）が入力されて
    // いればそちらを優先し、無ければ入金時の割合で現在の解約返戻金を按分した概算値を使う。
    const {
      general: generalAmt,

    insuranceSavingsSeparateAccountJpy += separateAmt;
    insuranceSavingsJpy += generalAmt;
    // 通貨別（円建て／外貨建て）は、資産クラスの分類（一般勘定／特別勘定）とは別軸の判定であり、
    // 契約の通貨（円建て契約か、ドル建てなど外貨建て契約か）で決まる。円入金・円換算の解約返戻金
    // であっても、保険会社が外貨に変換して運用している商品（外貨建て契約）は為替リスクを負って
    // いるため外貨建てとして扱う（現在の解約返戻金の「円換算」は実務上の払戻通貨の話であり、
    // 保有資産としての通貨エクスポージャーとは別の話のため、ここでは使わない）。
    if ((ct.currency || '円') === '円') currencyJpyJpy += amount;else currencyForeignJpy += amount;
  });
  const manualFundsStocksJpy = parseFloat(portfolioInputs.fundsStocksJpy) || 0;
  const depositsJpy = parseFloat(portfolioInputs.depositsJpy) || 0;
  const bondsJpy = parseFloat(portfolioInputs.bondsJpy) || 0;
  const fxJpy = parseFloat(portfolioInputs.fxJpy) || 0;
  const cryptoJpy = parseFloat(portfolioInputs.cryptoJpy) || 0;
  const realEstateJpy = parseFloat(portfolioInputs.realEstateJpy) || 0;
  const retirementJpy = parseFloat(portfolioInputs.retirementJpy) || 0;
  const inheritanceJpy = parseFloat(portfolioInputs.inheritanceJpy) || 0;
  const corpOtherJpy = parseFloat(portfolioInputs.realEstateOtherJpy) || 0;
  // 「その他」＝ゴルフ会員権・自家用車・家財一式・美術品/骨董品・仏具/墓地・自由記入分をまとめて1区分にする
  // （それぞれ別区分にすると円グラフが細かくなりすぎるため、資産クラス別グラフでは合算表示）。
  const golfMembershipJpy = parseFloat(portfolioInputs.golfMembershipJpy) || 0;
  const carJpy = parseFloat(portfolioInputs.carJpy) || 0;
  const householdItemsJpy = parseFloat(portfolioInputs.householdItemsJpy) || 0;
  const artJpy = parseFloat(portfolioInputs.artJpy) || 0;

  const othersJpy = parseFloat(portfolioInputs.othersJpy) || 0;
  const miscOtherJpy = golfMembershipJpy + carJpy + householdItemsJpy + artJpy + graveJpy + othersJpy;
  // 預貯金・債券・FX・不動産・退職金・相続・自社株・その他は、円建てはそのままの金額として扱う
  // （不動産等は評価額を円で入力する運用のため、外貨建てという概念を想定していない）。
  const manualJpyAssetsTotal = depositsJpy + bondsJpy + fxJpy + cryptoJpy + realEstateJpy + retirementJpy + inheritanceJpy + corpOtherJpy + miscOtherJpy;
  const assetClassChart = [{
    label: '現金・預貯金',
    value: Math.round(depositsJpy),
    color: '#0EA5E9'
  }, {
    label: '投資信託・株式等',
    value: Math.round(manualFundsStocksJpy),
    color: '#2563EB'
  }, {

  }, {

  }, {

    value: Math.round(retirementJpy),
    color: '#65A30D'
  }, {
    label: '相続',
    value: Math.round(inheritanceJpy),
    color: '#CA8A04'
  }, {
    label: '自社株',

  const currencyChart = [{

  const portfolioTotal = assetClassChart.reduce((s, i) => s + i.value, 0);

  // デフォルト集計からは除外する（資産クラス別の内訳表示にはそのまま残す）。
  const liquidPortfolioTotal = portfolioTotal - Math.round(corpOtherJpy);
  return {
    assetClassChart,
    currencyChart,
    portfolioTotal,
    liquidPortfolioTotal,
    insuranceSavingsUnconvertible,
    currencyUnconvertible,
    unconvertibleSavingsContracts,

  };
}

// ── 老後プランニング：退職後の生活費・年金見込み・現在の資産から必要な積立額を逆算する ──
function nexusComputeRetirement(inputs, currentAge, currentAssetsJpy) {
  const retirementAge = inputs && inputs.retirementAge !== undefined && inputs.retirementAge !== '' ? parseFloat(inputs.retirementAge) : null;
  const lifeExpectancy = inputs && inputs.lifeExpectancy !== undefined && inputs.lifeExpectancy !== '' ? parseFloat(inputs.lifeExpectancy) : null;
  const desiredMonthlyExpense = parseFloat(inputs && inputs.desiredMonthlyExpense) || 0;
  const pensionMonthly = parseFloat(inputs && inputs.pensionMonthly) || 0;
  const spousePensionMonthly = parseFloat(inputs && inputs.spousePensionMonthly) || 0;
  const otherMonthlyIncome = parseFloat(inputs && inputs.otherMonthlyIncome) || 0;
  const yearsInRetirement = retirementAge !== null && lifeExpectancy !== null ? Math.max(0, lifeExpectancy - retirementAge) : null;
  const monthlyShortfall = desiredMonthlyExpense - pensionMonthly - spousePensionMonthly - otherMonthlyIncome;
  const totalNeededJpy = yearsInRetirement !== null ? Math.max(0, monthlyShortfall) * 12 * yearsInRetirement : null;
  const yearsToRetirement = retirementAge !== null && currentAge !== null ? Math.max(0, retirementAge - currentAge) : null;
  // 資産は一括りにポートフォリオ合計へ利回りをかけるのではなく、資産ごとに「この資産は
  // この時いくらになる予想か」を個別に入力できるようにする（円建ての年金保険のように満期額が
  // ほぼ確定しているものは手動でその金額を直接入力、それ以外は現在額×利回りで自動計算）。
  // 資産ごとの予想が1件も入力されていない場合は、従来通りポートフォリオ合計（自社株を除く）に
  // 一律の利回りをかけた概算にフォールバックする。
  const assetProjections = inputs && inputs.assetProjections || [];
  const hasAssetProjections = assetProjections.length > 0;
  const projectionYears = yearsToRetirement !== null ? yearsToRetirement : 0;
  const itemizedProjectedAssetsJpy = Math.round(assetProjections.reduce((sum, a) => {
    if (a.mode === 'manual') return sum + (parseFloat(a.manualValue) || 0);
    const cur = parseFloat(a.currentValue) || 0;
    const rate = parseFloat(a.rate) || 0;
    return sum + cur * Math.pow(1 + rate / 100, projectionYears);
  }, 0));
  const assetReturnRate = inputs && inputs.assetReturnRate !== undefined && inputs.assetReturnRate !== '' ? parseFloat(inputs.assetReturnRate) : 0;
  const blanketProjectedAssetsJpy = yearsToRetirement !== null ? Math.round((currentAssetsJpy || 0) * Math.pow(1 + assetReturnRate / 100, yearsToRetirement)) : currentAssetsJpy || 0;
  const projectedAssetsJpy = hasAssetProjections ? itemizedProjectedAssetsJpy : blanketProjectedAssetsJpy;
  const shortfallAfterAssetsJpy = totalNeededJpy !== null ? Math.max(0, totalNeededJpy - projectedAssetsJpy) : null;
  const requiredMonthlySavings = shortfallAfterAssetsJpy !== null && yearsToRetirement ? Math.round(shortfallAfterAssetsJpy / (yearsToRetirement * 12)) : null;
  return {
    retirementAge,
    lifeExpectancy,
    assetReturnRate,
    hasAssetProjections,
    projectedAssetsJpy,
    yearsInRetirement,
    monthlyShortfall,
    totalNeededJpy,
    yearsToRetirement,
    currentAssetsJpy: currentAssetsJpy || 0,
    shortfallAfterAssetsJpy,
    requiredMonthlySavings
  };
}

// ── 教育資金プランニング：進学段階ごとの標準的な学習費（文部科学省「子供の学習費調査」等を参考にした目安。単位：万円）──
const NEXUS_EDUCATION_STAGES = [{
  key: 'kindergarten',

  startAge: 3,

}, {

}, {

}, {

function nexusComputeEducationPlan(kidAge, track) {
  return NEXUS_EDUCATION_STAGES.map(stage => {
    const options = stage.lumpCosts || stage.annualCosts;
    const selected = track && track[stage.key] && options[track[stage.key]] !== undefined ? track[stage.key] : Object.keys(options)[0];
    const totalCostJpy = (stage.lumpCosts ? stage.lumpCosts[selected] : stage.annualCosts[selected] * stage.years) * 10000;
    const annualCostJpy = stage.lumpCosts ? null : stage.annualCosts[selected] * 10000;
    const endAge = stage.startAge + stage.years;
    let status, remainingCostJpy, monthsUntilStart = null;
    if (kidAge === null || kidAge === undefined) {
      status = 'unknown';
      remainingCostJpy = totalCostJpy;
    } else if (kidAge >= endAge) {
      status = 'done';
      remainingCostJpy = 0;
    } else if (kidAge >= stage.startAge) {
      status = 'ongoing';
      remainingCostJpy = stage.lumpCosts ? totalCostJpy : annualCostJpy * (endAge - kidAge);
    } else {
      status = 'upcoming';
      remainingCostJpy = totalCostJpy;
      monthsUntilStart = Math.round((stage.startAge - kidAge) * 12);
    }
    return {
      key: stage.key,
      label: stage.label,
      selected,
      options: Object.keys(options),
      startAge: stage.startAge,
      endAge,
      status,
      totalCostJpy,
      remainingCostJpy,
      monthsUntilStart
    };
  });
}
function nexusEducationSummary(rows, plan) {
  const totalRemainingJpy = rows.reduce((s, r) => s + r.remainingCostJpy, 0);
  const uni = rows.find(r => r.key === 'university');

  const prepared = parseFloat(plan && plan.preparedJpy) || 0;

  // 準備資金は、①1つの金額に対して「今のまま」から大学入学までを年率〇%で運用した場合の
  // 予想額まで複利で伸ばして自動計算する方法／満期額のようにほぼ確定している金額を直接入力する
  // 方法（従来のシンプル版）に加えて、②学資保険・NISA等を資産ごとに個別入力する方法（老後
  // プランニングと同じ「資産ごとの将来予想額」）も選べる。②を1件でも入力した場合はそちらを優先する。
  const assetProjections = plan && plan.assetProjections || [];
  const hasAssetProjections = assetProjections.length > 0;
  const itemizedProjectedJpy = Math.round(assetProjections.reduce((sum, a) => {
    if (a.mode === 'manual') return sum + (parseFloat(a.manualValue) || 0);
    const cur = parseFloat(a.currentValue) || 0;
    const rate = parseFloat(a.rate) || 0;
    return sum + cur * Math.pow(1 + rate / 100, projectionYears);
  }, 0));
  const isManual = plan && plan.projectionMode === 'manual';

  const blanketProjectedJpy = isManual ? parseFloat(plan && plan.manualProjectedJpy) || 0 : monthsToUniversity !== null ? Math.round(prepared * Math.pow(1 + assetReturnRate / 100, projectionYears)) : prepared;
  const projectedPreparedJpy = hasAssetProjections ? itemizedProjectedJpy : blanketProjectedJpy;
  const shortfallJpy = Math.max(0, universityNeededJpy - projectedPreparedJpy);
  const monthlySavingsNeeded = monthsToUniversity && monthsToUniversity > 0 ? Math.round(shortfallJpy / monthsToUniversity) : null;
  return {
    totalRemainingJpy,
    universityNeededJpy,
    prepared,
    hasAssetProjections,
    isManual,
    assetReturnRate,
    projectedPreparedJpy,
    shortfallJpy,
    monthsToUniversity,
    monthlySavingsNeeded
  };
}

// ── 住宅資金プランニング：将来の住宅購入を想定した頭金積立・住宅ローン月々返済額の試算 ──
function nexusComputeHousingPlan(inputs, currentAge) {
  const purchaseAge = inputs && inputs.purchaseAge !== undefined && inputs.purchaseAge !== '' ? parseFloat(inputs.purchaseAge) : null;
  const homePrice = parseFloat(inputs && inputs.homePrice) || 0;

  const downPaymentNeededJpy = Math.round(homePrice * downPaymentRatio / 100);
  // 頭金準備額は、①1つの金額に対して「今のまま」から購入予定年齢までを年率〇%で運用した場合の
  // 予想額まで複利で伸ばして自動計算する方法／満期額のようにほぼ確定している金額を直接入力する
  // 方法（従来のシンプル版）に加えて、②預貯金・保険等を資産ごとに個別入力する方法（老後
  // プランニングと同じ「資産ごとの将来予想額」）も選べる。②を1件でも入力した場合はそちらを優先する。
  const assetProjections = inputs && inputs.assetProjections || [];
  const hasAssetProjections = assetProjections.length > 0;
  const projectionYears = yearsToPurchase !== null ? yearsToPurchase : 0;
  const itemizedProjectedJpy = Math.round(assetProjections.reduce((sum, a) => {
    if (a.mode === 'manual') return sum + (parseFloat(a.manualValue) || 0);
    const cur = parseFloat(a.currentValue) || 0;
    const rate = parseFloat(a.rate) || 0;
    return sum + cur * Math.pow(1 + rate / 100, projectionYears);
  }, 0));
  const isManual = inputs && inputs.projectionMode === 'manual';
  const assetReturnRate = inputs && inputs.assetReturnRate !== undefined && inputs.assetReturnRate !== '' ? parseFloat(inputs.assetReturnRate) || 0 : 0;
  const blanketProjectedJpy = isManual ? parseFloat(inputs && inputs.manualProjectedJpy) || 0 : yearsToPurchase !== null ? Math.round(currentSaved * Math.pow(1 + assetReturnRate / 100, yearsToPurchase)) : currentSaved;
  const projectedSavedJpy = hasAssetProjections ? itemizedProjectedJpy : blanketProjectedJpy;
  const shortfallJpy = Math.max(0, downPaymentNeededJpy - projectedSavedJpy);

    purchaseAge,
    homePrice,
    downPaymentRatio,
    downPaymentNeededJpy,
    currentSaved,
    hasAssetProjections,
    isManual,
    assetReturnRate,
    projectedSavedJpy,
    shortfallJpy,
    yearsToPurchase,
    monthlySavingsNeeded,
    loanAmountJpy,
    loanRate,
    loanYears,
    estimatedMonthlyPayment
  };
}
