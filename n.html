// ── 年齢自動計算（生年月日→今日時点の満年齢）────────────────
const calcAge = birthdate => {
  if (!birthdate) return null;
  const [y, m, d] = birthdate.split('-').map(Number);
  const today = new Date();
  let age = today.getFullYear() - y;
  if (today.getMonth() + 1 < m || today.getMonth() + 1 === m && today.getDate() < d) age--;
  return age;
};

// ── 手動入力年齢の自動加算（入力年を記録して毎年+1）─────────
// 入力時に ageYear（入力した西暦）を一緒に保存
// 表示時: 入力年齢 + (今年 - 入力年) で現在の年齢を算出
const calcStoredAge = (age, ageYear) => {
  if (!age) return null;
  const diff = ageYear ? new Date().getFullYear() - Number(ageYear) : 0;
  return Number(age) + diff;
};

const DISABILITY_TYPES = ['なし', '知的障害', '身体障害', 'その他の障害'];
const DISABILITY_NOTES = {
  '知的障害': '成年後見制度の利用や特別支援を見据えた、長期にわたる資金準備が必要。保険金の受取方法（指定代理請求人の設定等）もあわせて検討。',

// customer（顧客レコード）から分類ロジックの入力形式を組み立てる。
// ロジック本体（classifyHousehold）はアプリのデータ構造に依存しない
// 純粋関数にしてあるので、他画面・他ツールに移植する場合はこのアダプター
// 部分だけを差し替えれば良い。
function buildHouseholdInput(customer, customers) {
  const age = customer.birthdate ? calcAge(customer.birthdate) : calcStoredAge(customer.age, customer.ageYear);
  // サスペクトが既存の顧客と連携（linkedCustomerId）している場合、年齢等はその顧客の登録情報を優先する
  const householdMembers = (customer.suspects || []).filter(sp => sp.cohabiting).map(sp => {
    const linked = sp.linkedCustomerId && customers ? customers.find(x => x.id === sp.linkedCustomerId) : null;
    if (linked) {
      return {
        relation: sp.relation || '',
        age: linked.birthdate ? calcAge(linked.birthdate) : calcStoredAge(linked.age, linked.ageYear),
        disability: sp.disability || 'なし'
      };
    }
    return {
      relation: sp.relation || '',
      age: sp.birthdate ? calcAge(sp.birthdate) : calcStoredAge(sp.age, sp.ageYear),
      disability: sp.disability || 'なし'
    };
  });
  return {
    age,
    maritalStatus: customer.maritalStatus || '不明',
    dualIncome: !!customer.dualIncome,
    employmentType: customer.employmentType || '',
    householdMembers
  };
}

// 世帯属性の判定ロジック本体（純粋関数・アプリのデータ構造に非依存）
// input: { age, maritalStatus, dualIncome, employmentType, householdMembers: [{relation, age, disability}] }
function classifyHousehold(input) {
  const age = input.age ?? null;
  const marital = input.maritalStatus || '不明';
  const members = input.householdMembers || [];
  const allChildren = members.filter(m => m.relation === '子供');
  // 22歳以上（年齢不明を除く）は経済的に独立した「成人した子」として扱い、
  // 教育費を前提とする子育て世帯の判定からは除外する
  const children = allChildren.filter(c => c.age === null || c.age === undefined || c.age < 22);
  const grownChildren = allChildren.filter(c => c.age !== null && c.age !== undefined && c.age >= 22);
  const hasChildren = children.length > 0;
  const hasGrownChildren = grownChildren.length > 0;
  const childAges = children.map(c => c.age).filter(a => a !== null && a !== undefined);
  const youngestChildAge = childAges.length ? Math.min(...childAges) : null;
  const hasCohabitingParent = members.some(m => m.relation === '親' || m.relation === '祖父母');
  const hasSpouse = members.some(m => m.relation === '配偶者') || marital === '既婚';
  const livesAlone = members.length === 0;
  const disabledDependents = members.filter(m => m.disability && m.disability !== 'なし');
  const disabilityTypes = [...new Set(disabledDependents.map(m => m.disability))];
  const disabilityNote = disabilityTypes.length ? disabilityTypes.map(t => DISABILITY_NOTES[t] || DISABILITY_NOTES['その他の障害']).join(' ') : null;
  const employmentNote = input.employmentType && EMPLOYMENT_TYPE_NOTES[input.employmentType] ? EMPLOYMENT_TYPE_NOTES[input.employmentType] : null;

  const result = (category, reason) => ({
    code: category.code,
    label: category.label,
    reason,
    coverageNote: category.coverageNote,
    disabilityTypes,
    disabilityNote,
    employmentType: input.employmentType || '',
    employmentNote
  });

  // 0. 未成年：18歳未満は婚姻・世帯の分類対象外として最優先で判定
  //    （本人が自分自身の保障を検討する主体ではないため）
  if (age !== null && age < 18) {
    return result(HOUSEHOLD_CATEGORIES.MINOR, `${age}歳の未成年のため`);
  }
  // 1. 二世帯・三世代同居：親と同居している場合は他の条件より優先して判定
  if (hasCohabitingParent) {
    return result(HOUSEHOLD_CATEGORIES.MULTI_GEN, '親と同居しているため');
  }
  // 2. ひとり親世帯：配偶者なしで同居の子がいる場合（既婚・子なしより優先）
  if (hasChildren && !hasSpouse) {
    return result(HOUSEHOLD_CATEGORIES.SINGLE_PARENT, '配偶者なしで同居の子がいるため');
  }
  // 3. 高齢単身世帯：65歳以上かつ同居家族なし（婚姻歴による分類より優先）
  if (age !== null && age >= 65 && livesAlone) {
    return result(HOUSEHOLD_CATEGORIES.ELDERLY_SINGLE, '65歳以上で同居家族がいないため');
  }
  // 4. 死別・離婚世帯：婚姻状況が死別/離婚で、同居の子はいない場合
  if (marital === '死別' || marital === '離婚') {
    return result(HOUSEHOLD_CATEGORIES.BEREAVED_DIVORCED, `婚姻状況が「${marital}」のため`);
  }
  // 5・6. 子育て世帯：同居の子がいる場合。最年少の子が未就学(6歳未満)かどうかで分岐
  if (hasChildren) {
    if (youngestChildAge !== null && youngestChildAge < 6) {
      return result(HOUSEHOLD_CATEGORIES.CHILDCARE_PRESCHOOL, '未就学（6歳未満）の同居の子がいるため');
    }
    return result(HOUSEHOLD_CATEGORIES.CHILDCARE_SCHOOLAGE, '就学年齢（6歳以上）の同居の子がいるため');
  }
  // 7. 子育て卒業後：配偶者と同居し、22歳以上の成人した子がいる（もう教育費がかからない）場合
  if (hasSpouse && hasGrownChildren) {
    return result(HOUSEHOLD_CATEGORIES.EMPTY_NEST, '配偶者と同居し、同居の子が22歳以上（独立済み）のため');
  }
  // 8. DINKs：配偶者と同居・子なし・共働きの場合
  if (hasSpouse && input.dualIncome) {
    return result(HOUSEHOLD_CATEGORIES.DINKS, '配偶者と同居し共働きで子がいないため');
  }
  // 9. 既婚・子なし：配偶者と同居・子なし（共働きでない、または不明）
  if (hasSpouse) {
    return result(HOUSEHOLD_CATEGORIES.MARRIED_NO_CHILD, '配偶者と同居し子がいないため');
  }
  // 10. 同棲・事実婚：婚姻状況が事実婚
  if (marital === '事実婚') {
    return result(HOUSEHOLD_CATEGORIES.COHABITING, '婚姻状況が「事実婚」のため');
  }
  // 11. 独身（単身）：上記いずれにも該当しない場合のデフォルト
  return result(HOUSEHOLD_CATEGORIES.SINGLE, '該当する世帯類型がないため');
}

// ── 顧客ランク自動判定 ────────────────────────────────────────
// S: 複数契約 + (紹介あり or 高額)

function importJSON(file, handlers) {
  // handlers = { setCustomers, setTasks, setClients, setVision, setSuspects, setSales, setLogs,
  //              setMemos, setKpiSettings, setNexusServices, setNexusServiceLinks, setNexusMission }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);

      // ⓪ 全データバックアップ形式（機種変更などで端末を移行する場合に使用）
      //    { __medilifeBackup: true, customers, memos, kpiSettings, tasks, clients, vision,
      //      suspects, logs, sales, nexusServices, nexusServiceLinks, nexusMission }
      if (data.__medilifeBackup) {
        if (!confirm('この端末の現在のデータをすべて、バックアップの内容で置き換えます。よろしいですか？')) return;
        if (data.customers) handlers.setCustomers(data.customers);
        if (data.memos && handlers.setMemos) handlers.setMemos(data.memos);
        if (data.kpiSettings && handlers.setKpiSettings) handlers.setKpiSettings(data.kpiSettings);
        if (data.tasks && handlers.setTasks) handlers.setTasks(data.tasks);
        if (data.clients && handlers.setClients) handlers.setClients(data.clients);
        if (data.vision && handlers.setVision) handlers.setVision(data.vision);
        if (data.suspects && handlers.setSuspects) handlers.setSuspects(data.suspects);
        if (data.logs && handlers.setLogs) handlers.setLogs(data.logs);
        if (data.sales && handlers.setSales) handlers.setSales(data.sales);
        if (data.nexusServices && handlers.setNexusServices) handlers.setNexusServices(data.nexusServices);
        if (data.nexusServiceLinks && handlers.setNexusServiceLinks) handlers.setNexusServiceLinks(data.nexusServiceLinks);
        if (data.nexusMission && handlers.setNexusMission) handlers.setNexusMission(data.nexusMission);
        alert('✅ 全データを復元しました');
        return;
      }

      // ① app.html バックアップ形式
      //    { tasks, clients, suspects, vision, sales, logs, exportedAt, version }
      if (data.tasks || data.logs || data.clients && !data.customers) {
        const msgs = [];
        if (data.tasks && handlers.setTasks) {
          handlers.setTasks(data.tasks);
          msgs.push(`タスク${data.tasks.length}件`);
        }
        if (data.clients && handlers.setClients) {
          handlers.setClients(data.clients);
          msgs.push(`クライアント${data.clients.length}件`);
        }
        if (data.suspects && handlers.setSuspects) {
          handlers.setSuspects(data.suspects);
          msgs.push(`サスペクト${data.suspects.length}件`);
        }
        if (data.vision && handlers.setVision) {
          handlers.setVision(data.vision);
        }
        if (data.sales && handlers.setSales) {
          handlers.setSales(data.sales);
        }
        if (data.logs && handlers.setLogs) {
          handlers.setLogs(data.logs);
          msgs.push(`ログ${data.logs.length}件`);
        }
        alert(`✅ バックアップ復元完了\n${msgs.join(' / ')}`);
        return;
      }

      // ② nexus.html JSON エクスポート形式 { customers: [...] }
      if (data.customers && Array.isArray(data.customers)) {
        handlers.setCustomers(prev => {
          const existingIds = new Set(prev.map(c => c.id));
          const newOnes = data.customers.filter(c => !existingIds.has(c.id));
          alert(`✅ 顧客インポート完了：${newOnes.length}件追加`);
          return [...prev, ...newOnes];
        });
        return;
      }

      // ③ 直接配列（顧客データ）
      if (Array.isArray(data)) {
        handlers.setCustomers(prev => {
          const existingIds = new Set(prev.map(c => c.id));
          const newOnes = data.filter(c => !existingIds.has(c.id));
          alert(`✅ 顧客インポート完了：${newOnes.length}件追加`);
          return [...prev, ...newOnes];
        });
        return;
      }
      alert('対応していないファイル形式です');
    } catch {
      alert('JSONの読み込みに失敗しました');
    }
  };
  reader.readAsText(file, 'UTF-8');
}

// ── RFC4180準拠 CSVパーサー（改行含むフィールド対応）──────────
function parseCSVFull(text) {
  const rows = [];
  let row = [],
    field = '',
    inQ = false,
    i = 0;
  const t = text.replace(/^﻿/, ''); // BOM除去
  while (i < t.length) {
    const ch = t[i];
    if (inQ) {
      if (ch === '"' && t[i + 1] === '"') {
        field += '"';
        i += 2;
      } else if (ch === '"') {
        inQ = false;
        i++;
      } else {
        field += ch;
        i++;
      }
    } else {
      if (ch === '"') {
        inQ = true;
        i++;
      } else if (ch === ',') {
        row.push(field);
        field = '';
        i++;
      } else if (ch === '\r' && t[i + 1] === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
        i += 2;
      } else if (ch === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
        i++;
      } else {
        field += ch;
        i++;
      }
    }
  }
  if (field || row.length > 0) {
    row.push(field);
    if (row.some(f => f)) rows.push(row);
  }
  return rows;
}

  const linkedCorp = customer.customerType !== '法人' ? (customer.linkedCorpId ? customers.find(c => c.id === customer.linkedCorpId && c.customerType === '法人') : null) || (customer.name ? customers.find(c => c.customerType === '法人' && (c.representative || '').trim() && (c.representative || '').trim() === customer.name.trim()) : null) : null;
  const linkedCorpIsAutoDetected = !!linkedCorp && !customer.linkedCorpId;
  const contracts = customer.contracts || [];
  const corpContracts = linkedCorp ? linkedCorp.contracts || [] : [];
  const allContractsForCharts = [...contracts, ...corpContracts];

  // 一時払・前期前納・全期前納（まとまった一括払込）は月払保険料に混ぜず、別枠で集計する
  const companyChart = (() => {
    const byCompany = {};
    allContractsForCharts.forEach(r => {
      const cyc = r.paymentCycle || '月払';
      if (LUMP_LIKE_PAYMENT_CYCLES.includes(cyc)) return;
      const c = (r.company || '').trim() || '未記入';
      const raw = parseFloat(r.premium) || 0;
      const monthly = cyc === '年払' ? raw / 12 : raw;
      if (monthly > 0) byCompany[c] = (byCompany[c] || 0) + Math.round(monthly);
    });
    return Object.entries(byCompany).map(([label, value]) => ({
      label,
      value
    }));
  })();
  const lumpSumChart = (() => {
    const byCompany = {};
    allContractsForCharts.forEach(r => {
      if (!LUMP_LIKE_PAYMENT_CYCLES.includes(r.paymentCycle || '月払')) return;
      const c = (r.company || '').trim() || '未記入';
      const v = parseFloat(r.premium) || 0;
      if (v > 0) byCompany[c] = (byCompany[c] || 0) + v;
    });
    return Object.entries(byCompany).map(([label, value]) => ({
      label,
      value
    }));
  })();
  const typeChart = (() => {
    const byType = {};
    allContractsForCharts.forEach(r => {
      const t = (r.type || '').trim() || '未記入';
      byType[t] = (byType[t] || 0) + 1;
    });
    return Object.entries(byType).map(([label, value]) => ({
      label,
      value
    }));
  })();

  // ── ポートフォリオ（通貨別・資産クラス別）── 画面表示は常に本人（＋関連法人）ベース
  // 「投資信託・株式等」は、銘柄別に入力した株式・投資信託の評価額合計＋その他概算（手入力）分
  const {
    assetClassChart,
    currencyChart,
    portfolioTotal,
    insuranceSavingsUnconvertible,
    currencyUnconvertible,
    unconvertibleSavingsContracts,
    insuranceSavingsSeparateAccountJpy
  } = nexusComputePortfolio(allContractsForCharts, {
    fundsStocksJpy: nexusPortfolioFundsStocksTotal(portfolio),
    realEstateOtherJpy: portfolio.realEstateOtherJpy
  });

  // ── 夫婦合算（資料の対象で選べる）── 配偶者が顧客連携済みの場合のみ計算
  const spouseContracts = linkedSpouseCustomer ? linkedSpouseCustomer.contracts || [] : [];
  const spousePortfolioInputs = linkedSpouseCustomer && linkedSpouseCustomer.lp && linkedSpouseCustomer.lp.portfolio || {};
  const coupleContractsForCharts = [...allContractsForCharts, ...spouseContracts];
  const couplePortfolioInputs = {
    fundsStocksJpy: nexusPortfolioFundsStocksTotal(portfolio) + nexusPortfolioFundsStocksTotal(spousePortfolioInputs),
    realEstateOtherJpy: (parseFloat(portfolio.realEstateOtherJpy) || 0) + (parseFloat(spousePortfolioInputs.realEstateOtherJpy) || 0)
  };
  const couplePortfolio = linkedSpouseCustomer ? nexusComputePortfolio(coupleContractsForCharts, couplePortfolioInputs) : null;
  const isCoupleScope = printScope === 'couple' && !!linkedSpouseCustomer;
  const scopedPortfolio = isCoupleScope ? couplePortfolio : {
    assetClassChart,
    currencyChart,
    portfolioTotal,
    insuranceSavingsUnconvertible,
    currencyUnconvertible,
    unconvertibleSavingsContracts,
    insuranceSavingsSeparateAccountJpy
  };
  const buildPurposeRowsForPrint = (title, list) => {
    const {
      byPurpose,
      deathTotal,
      medicalTotal
    } = nexusPurposeSummary(list);
    const rows = CONTRACT_PURPOSES.filter(p => byPurpose[p] > 0).map(p => `<tr><td>${p}</td><td>${byPurpose[p].toLocaleString()}円</td></tr>`).join('');
    return `<div class="print-section">
      <h3>${escapeHtmlForPrint(title)}</h3>
      <table><tr><th>目的</th><th>保険金額合計</th></tr>${rows || '<tr><td colspan="2">データなし</td></tr>'}</table>
      <p style="font-size:12px;"><b>死亡保険金額合計：${deathTotal.toLocaleString()}円</b>　／　<b>医療保険金額合計：${medicalTotal.toLocaleString()}円</b></p>
      </div>`;
  };
  const buildPrintHtml = () => {
    const rowsHtml = list => list.length ? list.map((r, i) => `
      <tr><td>${i + 1}</td><td>${escapeHtmlForPrint(nexusContractPurposes(r).join('、'))}</td><td>${escapeHtmlForPrint(r.type)}</td><td>${escapeHtmlForPrint(r.company)}</td><td>${escapeHtmlForPrint(r.policyNum)}</td>
      <td>${escapeHtmlForPrint(r.date)}</td><td>${escapeHtmlForPrint(r.termNote || r.termEnd)}</td><td>${escapeHtmlForPrint(r.paymentTermNote || r.paymentTermEnd)}</td>
      <td>${r.coverageAmount ? Number(r.coverageAmount).toLocaleString() + (r.currency || '円') : ''}</td>
      <td>${r.currentSurrenderValue ? Number(r.currentSurrenderValue).toLocaleString() + (r.currency || '円') : ''}</td>
      <td>${escapeHtmlForPrint(r.premium)}${r.paymentCycle || ''}</td></tr>`).join('') : '<tr><td colspan="11">登録なし</td></tr>';
    const famRows = (customer.suspects || []).length ? (customer.suspects || []).map(m => {
      const linked = m.linkedCustomerId ? customers.find(x => x.id === m.linkedCustomerId) : null;
      const fName = linked ? linked.name || linked.corporateName || '(名称未設定)' : m.name;
      const fAge = linked ? linked.birthdate ? calcAge(linked.birthdate) : calcStoredAge(linked.age, linked.ageYear) : m.birthdate ? calcAge(m.birthdate) : calcStoredAge(m.age, m.ageYear);
      const fHasInsurance = linked ? (linked.contracts || []).length > 0 ? 'yes' : 'unknown' : m.hasInsurance || 'unknown';
      return `
      <tr><td>${escapeHtmlForPrint(fName)}</td><td>${escapeHtmlForPrint(m.relation)}</td><td>${fAge ?? ''}</td>
      <td>${FAMILY_INSURANCE_LABEL[fHasInsurance]}</td><td>${escapeHtmlForPrint(m.memo)}</td></tr>`;
    }).join('') : '<tr><td colspan="5">登録なし</td></tr>';
    const loanBasicRows = loans.length ? loans.map(l => `
      <tr><td>${escapeHtmlForPrint(LOAN_CATEGORIES.includes(l.category) ? l.category : '—')}</td><td>${escapeHtmlForPrint(l.name)}</td>
      <td>${l.balance ? Number(l.balance).toLocaleString() + '円' : ''}</td><td>${escapeHtmlForPrint(l.rate)}${l.rate ? '%' : ''}</td><td>${escapeHtmlForPrint(l.rateType)}</td>
      <td>${l.monthlyPayment ? Number(l.monthlyPayment).toLocaleString() + '円' : ''}</td>
      <td>${l.hasBonusPayment ? 'あり（' + (l.bonusPaymentAmount ? Number(l.bonusPaymentAmount).toLocaleString() + '円/年' : '金額未記入') + '）' : 'なし'}</td>
      <td>${escapeHtmlForPrint(l.repaymentMethod)}</td>
      <td>${l.payoffMonth ? escapeHtmlForPrint(l.payoffMonth) : loanRemainingYears(l) ? loanRemainingYears(l) + '年' : ''}</td></tr>`).join('') : '<tr><td colspan="9">登録なし</td></tr>';
    const loanDetailRows = loans.length ? loans.map(l => `
      <tr><td>${escapeHtmlForPrint(l.name) || escapeHtmlForPrint(l.category)}</td><td>${escapeHtmlForPrint(l.lender)}</td>
      <td>${escapeHtmlForPrint(l.originationDate)}</td><td>${l.originalAmount ? Number(l.originalAmount).toLocaleString() + '円' : ''}</td>
      <td>${escapeHtmlForPrint(l.guaranteeInsurance || '不明')}</td><td>${escapeHtmlForPrint(l.collateral)}</td><td>${escapeHtmlForPrint(l.guarantor || '不明')}</td></tr>`).join('') : '<tr><td colspan="7">登録なし</td></tr>';
    const {
      assetClassChart: pAssetClassChart,
      currencyChart: pCurrencyChart,
      portfolioTotal: pPortfolioTotal,
      insuranceSavingsUnconvertible: pInsuranceSavingsUnconvertible,
      currencyUnconvertible: pCurrencyUnconvertible
    } = scopedPortfolio;
    const assetClassRowsHtml = pAssetClassChart.length ? pAssetClassChart.map(i => `<tr><td>${escapeHtmlForPrint(i.label)}</td><td>${i.value.toLocaleString()}円</td><td>${pPortfolioTotal > 0 ? Math.round(i.value / pPortfolioTotal * 100) : 0}%</td></tr>`).join('') : '<tr><td colspan="3">データなし</td></tr>';
    const currencyRowsHtml = pCurrencyChart.length ? pCurrencyChart.map(i => `<tr><td>${escapeHtmlForPrint(i.label)}</td><td>${i.value.toLocaleString()}円</td></tr>`).join('') : '<tr><td colspan="2">データなし</td></tr>';
    const titleName = isCoupleScope ? `${escapeHtmlForPrint(customer.name)} 様・${escapeHtmlForPrint(linkedSpouseCustomer.name)} 様（ご夫婦）` : `${escapeHtmlForPrint(customer.name)} 様`;
    return `
      <h2>${titleName}　プランニング資料</h2>
      <p style="font-size:11px;color:#666;">出力日：${new Date().toLocaleDateString('ja-JP')}${isCoupleScope ? '　／　夫婦合算版' : ''}</p>
      <div class="print-section">
        <h3>ライフプラン タイムライン</h3>
        ${nexusTimelineHtmlForPrint(ageSelf, ageSpouse, categories)}
      </div>
      <div class="print-section">
        <h3>LPシート要約</h3>
        <table>
          <tr><th>本人年齢</th><td>${ageSelf !== null ? ageSelf + '歳' : ''}</td><th>配偶者年齢</th><td>${ageSpouse !== null ? ageSpouse + '歳' : ''}</td></tr>
          <tr><th>お子様</th><td colspan="3">${escapeHtmlForPrint(kidsSummary)}</td></tr>
          <tr><th>理想月間貯蓄額</th><td colspan="3">${monthlyTarget.toLocaleString()}円／月</td></tr>
        </table>
      </div>
      <div class="print-section">
        <h3>ローン明細（基本項目）</h3>
        <table><tr><th>区分</th><th>名称</th><th>残高</th><th>金利</th><th>金利タイプ</th><th>毎月返済額</th><th>ボーナス払い</th><th>返済方式</th><th>完済予定／残り年数</th></tr>${loanBasicRows}</table>
        <p style="font-size:12px;"><b>ローン残高合計：${totalLoanBalance.toLocaleString()}円</b></p>
      </div>
      <div class="print-section">
        <h3>ローン明細（詳細）</h3>
        <table><tr><th>名称</th><th>借入先</th><th>借入年月日</th><th>借入当初の金額</th><th>団信</th><th>担保</th><th>連帯保証人等</th></tr>${loanDetailRows}</table>
      </div>
      <div class="print-section">
        <h3>家計収支</h3>
        <table><tr><th>収入の種類</th><th>金額</th></tr>${incomeItems.length ? incomeItems.map(x => `<tr><td>${escapeHtmlForPrint(x.type)}</td><td>${x.amount ? Number(x.amount).toLocaleString() + '円' : ''}</td></tr>`).join('') : '<tr><td colspan="2">登録なし</td></tr>'}</table>
        <table><tr><th>支出の費目</th><th>金額</th></tr>${expenseItems.length ? expenseItems.map(x => `<tr><td>${escapeHtmlForPrint(x.category)}</td><td>${x.amount ? Number(x.amount).toLocaleString() + '円' : ''}</td></tr>`).join('') : '<tr><td colspan="2">登録なし</td></tr>'}</table>
        <table>
          <tr><th>収入合計</th><td>${totalIncome.toLocaleString()}円</td><th>支出合計</th><td>${totalExpense.toLocaleString()}円</td></tr>
          <tr><th>イベント収入</th><td>${eventIncome.toLocaleString()}円</td><th>イベント支出</th><td>${eventExpense.toLocaleString()}円</td></tr>
          <tr><th>年間貯蓄（自動計算）</th><td colspan="3">${computedAnnualSavings.toLocaleString()}円</td></tr>
        </table>
      </div>
      <div class="print-section">
        <h3>既契約一覧（本人）</h3>
        <table><tr><th>No</th><th>目的</th><th>保険種類</th><th>保険会社</th><th>証券番号</th><th>契約日</th><th>保険期間</th><th>払込期間</th><th>保険金額（加入当初）</th><th>現在の解約返戻金</th><th>保険料</th></tr>${rowsHtml(contracts)}</table>
      </div>
      ${buildPurposeRowsForPrint('保障集計（本人）', contracts)}
      ${linkedCorp ? `
      <div class="print-section">
        <h3>既契約一覧（関連法人：${escapeHtmlForPrint(linkedCorp.corporateName)}）</h3>
        <table><tr><th>No</th><th>目的</th><th>保険種類</th><th>保険会社</th><th>証券番号</th><th>契約日</th><th>保険期間</th><th>払込期間</th><th>保険金額（加入当初）</th><th>現在の解約返戻金</th><th>保険料</th></tr>${rowsHtml(corpContracts)}</table>
      </div>
        ${buildPurposeRowsForPrint('保障集計（法人）', corpContracts)}
      ` : ''}
      ${isCoupleScope ? `
      <div class="print-section">
        <h3>既契約一覧（配偶者：${escapeHtmlForPrint(linkedSpouseCustomer.name)}）</h3>
        <table><tr><th>No</th><th>目的</th><th>保険種類</th><th>保険会社</th><th>証券番号</th><th>契約日</th><th>保険期間</th><th>払込期間</th><th>保険金額（加入当初）</th><th>現在の解約返戻金</th><th>保険料</th></tr>${rowsHtml(spouseContracts)}</table>
      </div>
        ${buildPurposeRowsForPrint('保障集計（配偶者）', spouseContracts)}
        ${buildPurposeRowsForPrint('保障集計（世帯合算）', [...contracts, ...spouseContracts])}
      ` : ''}
      ${(() => {
      const stocksAll = isCoupleScope ? [...(portfolio.stocks || []), ...(spousePortfolioInputs.stocks || [])] : portfolio.stocks || [];
      const fundsAll = isCoupleScope ? [...(portfolio.funds || []), ...(spousePortfolioInputs.funds || [])] : portfolio.funds || [];
      if (stocksAll.length === 0 && fundsAll.length === 0) return '';
      const stockRows = stocksAll.map(st => {
        const ev = nexusStockEval(st);
        return `<tr><td>${escapeHtmlForPrint(st.name)}</td><td>${st.quantity || ''}株</td><td>${st.costPrice ? Number(st.costPrice).toLocaleString() + '円' : ''}</td><td>${st.currentPrice ? Number(st.currentPrice).toLocaleString() + '円' : ''}</td><td>${Math.round(ev.value).toLocaleString()}円</td><td>${ev.gain >= 0 ? '+' : ''}${Math.round(ev.gain).toLocaleString()}円</td></tr>`;
      }).join('');
      const fundRows = fundsAll.map(fd => {
        const ev = nexusFundEval(fd);
        return `<tr><td>${escapeHtmlForPrint(fd.name)}</td><td>${fd.units ? Number(fd.units).toLocaleString() : ''}口</td><td>${fd.costNav || ''}</td><td>${fd.currentNav || ''}</td><td>${Math.round(ev.value).toLocaleString()}円</td><td>${ev.gain >= 0 ? '+' : ''}${Math.round(ev.gain).toLocaleString()}円</td></tr>`;
      }).join('');
      return `
      <div class="print-section">
        <h3>保有株式一覧${isCoupleScope ? '｜夫婦合算' : ''}</h3>
        <table><tr><th>銘柄名</th><th>保有数量</th><th>取得単価</th><th>現在価格</th><th>評価額</th><th>評価損益</th></tr>${stockRows || '<tr><td colspan="6">登録なし</td></tr>'}</table>
      </div>
      <div class="print-section">
        <h3>保有投資信託一覧${isCoupleScope ? '｜夫婦合算' : ''}</h3>
        <table><tr><th>銘柄名</th><th>保有口数</th><th>取得時基準価額</th><th>現在基準価額</th><th>評価額</th><th>評価損益</th></tr>${fundRows || '<tr><td colspan="6">登録なし</td></tr>'}</table>
      </div>`;
    })()}
      <div class="print-section">
        <h3>ポートフォリオ（資産クラス別）${isCoupleScope ? '｜夫婦合算' : ''}</h3>
        <table><tr><th>区分</th><th>金額</th><th>割合</th></tr>${assetClassRowsHtml}</table>
      </div>
      <div class="print-section">
        <h3>ポートフォリオ（通貨別：円建て／外貨建て）${isCoupleScope ? '｜夫婦合算' : ''}</h3>
        <table><tr><th>区分</th><th>金額</th></tr>${currencyRowsHtml}</table>
        ${pInsuranceSavingsUnconvertible > 0 || pCurrencyUnconvertible > 0 ? '<p style="font-size:11px;color:#b98a3d;">※ 外貨建て契約のうち適用レート未入力のものは円換算できず、上記には含まれていません</p>' : ''}
      </div>
      <div class="print-section">
        <h3>家族構成</h3>
        <table><tr><th>お名前</th><th>続柄</th><th>年齢</th><th>既契約</th><th>メモ</th></tr>${famRows}</table>
      </div>
    `;
  };
  const handleOpenPrint = () => setShowPrint(true);
  const handleClosePrint = () => setShowPrint(false);
  const handleDoPrint = () => window.print();

  // ── Excel(.xlsx)出力：印刷資料と同じ「資料の対象（本人のみ／夫婦合算）」を使い、
  //    罫線・見出し色・列幅を付けた「表らしい」見た目のブックを組み立てる ──
  // 印刷資料（PDF）と同じ並び順で、1枚のシートに縦につなげて出力する。
  // 「タブが分かれた分析用ワークブック」ではなく「1つの資料」として読めるようにするため。
  // 元になったExcelの「ライフプランブロック」シートを再現：年齢0〜100の目盛りに沿って
  // 教育・住宅・老後・介護の各区分を色付きブロックで表示する年齢タイムライン。
  const buildLifePlanBlockSheet = wb => {
    const AGE_MAX = 100;
    const ws = wb.addWorksheet('ライフプランブロック');
    const cols = [{
      width: 16
    }];
    for (let age = 0; age <= AGE_MAX; age++) cols.push({
      width: 2.3
    });
    ws.columns = cols;
    const totalCols = AGE_MAX + 2;
    let row = 1;
    ws.mergeCells(row, 1, row, totalCols);
    const titleCell = ws.getCell(row, 1);
    titleCell.value = 'ライフプランブロック';
    titleCell.font = {
      bold: true,
      size: 18,
      color: {
        argb: NEXUS_XLSX_NAVY
      }
    };
    titleCell.alignment = {
      horizontal: 'center'
    };
    row += 1;
    ws.mergeCells(row, 1, row, totalCols);
    const subCell = ws.getCell(row, 1);
    subCell.value = `〜大切なお金と幸せな人生のために〜　（${customer.name} 様${isCoupleScope ? '・' + linkedSpouseCustomer.name + ' 様' : ''}）`;
    subCell.font = {
      size: 10,
      color: {
        argb: 'FF888888'
      }
    };
    subCell.alignment = {
      horizontal: 'center'
    };
    row += 2;

    // 年齢の目盛り（10歳刻み）
    {
      const tickRow = ws.getRow(row);
      for (let age = 0; age <= AGE_MAX; age += 10) {
        const cell = tickRow.getCell(age + 2);
        cell.value = age;
        cell.font = {
          size: 8,
          color: {
            argb: 'FF999999'
          }
        };
      }
      row += 1;
    }

    // 教育・住宅・老後・介護の色付きブロック行
    const timelineCats = Object.keys(LP_CATEGORY_LABELS).map(key => ({
      key,
      label: LP_CATEGORY_LABELS[key],
      color: LP_CATEGORY_COLORS[key],
      startAge: categories[key] && categories[key].startAge !== '' && categories[key].startAge !== undefined ? parseFloat(categories[key].startAge) : null,
      years: parseFloat(categories[key] && categories[key].years) || 0
    }));
    timelineCats.forEach(cat => {
      const r = ws.getRow(row);
      const labelCell = r.getCell(1);
      labelCell.value = cat.label;
      labelCell.font = {
        bold: true,
        size: 10
      };
      labelCell.alignment = {
        vertical: 'middle'
      };
      labelCell.border = {
        top: {
          style: 'thin',
          color: {
            argb: NEXUS_XLSX_GRID
          }
        },
        bottom: {
          style: 'thin',
          color: {
            argb: NEXUS_XLSX_GRID
          }
        }
      };
      for (let age = 0; age <= AGE_MAX; age++) {
        const cell = r.getCell(age + 2);
        const active = cat.startAge !== null && cat.years > 0 && age >= cat.startAge && age < cat.startAge + cat.years;
        cell.fill = {
          type: 'pattern',
          pattern: 'solid',
          fgColor: {
            argb: active ? 'FF' + cat.color : 'FFF2F2F2'
          }
        };
        cell.border = {
          top: {
            style: 'thin',
            color: {
              argb: NEXUS_XLSX_GRID
            }
          },
          left: {
            style: 'thin',
            color: {
              argb: NEXUS_XLSX_GRID
            }
          },
          bottom: {
            style: 'thin',
            color: {
              argb: NEXUS_XLSX_GRID
            }
          },
          right: {
            style: 'thin',
            color: {
              argb: NEXUS_XLSX_GRID
            }
          }
        };
      }
      row += 1;
    });
    row += 1;
    if (timelineCats.every(c => c.startAge === null)) {
